<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover — ShowFinder</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-4 sm:p-6 max-w-5xl mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold text-white">ShowFinder</h1>
      <p class="text-gray-400 text-sm mt-1">Discover new shows and movies</p>
    </div>
    <div class="flex items-center gap-1 sm:gap-2">
      <a href="/" class="text-sm text-gray-400 hover:text-white transition px-3 py-2">Watchlist</a>
      <a href="/settings" class="text-sm text-gray-400 hover:text-white transition px-3 py-2">Settings</a>
    </div>
  </div>

  <!-- Type toggle: TV / Movies -->
  <div class="flex gap-2 mb-4">
    <button id="type-btn-tv" onclick="setDiscoverType('tv')"
      class="text-sm px-4 py-1.5 rounded-full bg-blue-600 text-white font-medium transition">
      TV Shows
    </button>
    <button id="type-btn-movies" onclick="setDiscoverType('movies')"
      class="text-sm px-4 py-1.5 rounded-full bg-gray-800 text-gray-400 hover:text-white transition">
      Movies
    </button>
  </div>

  <!-- Category tabs -->
  <div class="flex gap-1 mb-6 bg-gray-900 p-1 rounded-xl border border-gray-800">
    <button class="tab-btn flex-1 text-sm py-2 px-3 rounded-lg bg-gray-800 text-white font-medium transition"
      onclick="loadDiscover('trending', this)">Trending</button>
    <button class="tab-btn flex-1 text-sm py-2 px-3 rounded-lg text-gray-400 hover:text-white transition"
      onclick="loadDiscover('similar', this)">Similar</button>
    <button class="tab-btn flex-1 text-sm py-2 px-3 rounded-lg text-gray-400 hover:text-white transition"
      onclick="loadDiscover('top', this)">Top by Year</button>
  </div>

  <!-- Content -->
  <div id="discover-content"
    hx-get="/discover/trending"
    hx-trigger="load"
    hx-swap="innerHTML">
    <div class="text-center py-16 text-gray-500 text-sm">Loading...</div>
  </div>

  <!-- Description modal -->
  <div id="discover-modal"
    style="display:none"
    class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4"
    onclick="if(event.target===this) closeDiscoverModal()">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md overflow-hidden">
      <div class="flex items-start gap-3 p-4 pb-3">
        <img id="modal-poster" src="" alt="" class="w-16 h-24 object-cover rounded-lg flex-shrink-0" />
        <div class="flex-1 min-w-0">
          <h3 id="modal-name" class="text-white font-semibold leading-tight pr-2"></h3>
          <div class="flex items-center gap-3 mt-1.5">
            <span id="modal-year" class="text-gray-500 text-sm"></span>
            <a id="modal-rating" href="" target="_blank" rel="noopener"
              class="text-yellow-400 text-sm hover:text-yellow-300 transition"></a>
          </div>
        </div>
        <button onclick="closeDiscoverModal()"
          class="text-gray-500 hover:text-white text-2xl leading-none flex-shrink-0 -mt-0.5">×</button>
      </div>
      <p id="modal-overview" class="text-gray-400 text-sm px-4 pb-5 leading-relaxed"></p>
    </div>
  </div>

  <script>
    var discoverType = 'tv';
    var discoverCategory = 'trending';

    function setDiscoverType(type) {
      discoverType = type;
      var active = 'text-sm px-4 py-1.5 rounded-full bg-blue-600 text-white font-medium transition';
      var inactive = 'text-sm px-4 py-1.5 rounded-full bg-gray-800 text-gray-400 hover:text-white transition';
      document.getElementById('type-btn-tv').className = type === 'tv' ? active : inactive;
      document.getElementById('type-btn-movies').className = type === 'movies' ? active : inactive;
      loadContent();
    }

    function loadDiscover(category, btn) {
      discoverCategory = category;
      document.querySelectorAll('.tab-btn').forEach(function(b) {
        b.classList.remove('bg-gray-800', 'text-white', 'font-medium');
        b.classList.add('text-gray-400');
      });
      if (btn) {
        btn.classList.remove('text-gray-400');
        btn.classList.add('bg-gray-800', 'text-white', 'font-medium');
      }
      loadContent();
    }

    function loadContent() {
      var url = discoverType === 'tv'
        ? '/discover/' + discoverCategory
        : '/discover/movies/' + discoverCategory;
      htmx.ajax('GET', url, {target: '#discover-content', swap: 'innerHTML'});
      closeDiscoverModal();
    }

    function openDiscoverModal(el) {
      document.getElementById('modal-name').textContent = el.dataset.name;
      document.getElementById('modal-overview').textContent = el.dataset.overview || 'No description available.';
      document.getElementById('modal-year').textContent = el.dataset.year;

      var poster = document.getElementById('modal-poster');
      poster.src = el.dataset.poster || '';
      poster.style.display = el.dataset.poster ? '' : 'none';

      var rating = document.getElementById('modal-rating');
      if (el.dataset.rating) {
        rating.textContent = '★ ' + el.dataset.rating + ' on TMDB';
        var mediaPath = (el.dataset.mediaType === 'movie') ? 'movie' : 'tv';
        rating.href = 'https://www.themoviedb.org/' + mediaPath + '/' + el.dataset.tmdbId;
      } else {
        rating.textContent = '';
      }

      document.getElementById('discover-modal').style.display = 'flex';
    }

    function closeDiscoverModal() {
      document.getElementById('discover-modal').style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeDiscoverModal();
    });
  </script>

</body>
</html>
