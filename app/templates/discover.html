<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover — ShowFinder</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen px-4 pt-4 pb-24 sm:pb-6 sm:px-6 max-w-5xl mx-auto">

  {% set active_page = 'discover' %}
  {% include "partials/nav.html" %}

  <!-- Type toggle: TV / Movies -->
  <div class="flex gap-2 mb-4">
    <button id="type-btn-tv" onclick="setDiscoverType('tv')"
      class="text-sm px-4 py-1.5 rounded-full bg-blue-600 text-white font-medium transition">
      TV Shows
    </button>
    <button id="type-btn-movies" onclick="setDiscoverType('movies')"
      class="text-sm px-4 py-1.5 rounded-full bg-gray-800 text-gray-400 hover:text-white transition">
      Movies
    </button>
  </div>

  <!-- Category tabs -->
  <div class="flex gap-1 mb-4 bg-gray-900 p-1 rounded-xl border border-gray-800">
    <button class="tab-btn flex-1 text-sm py-2 px-3 rounded-lg bg-gray-800 text-white font-medium transition"
      onclick="loadDiscover('trending', this)">Trending</button>
    <button class="tab-btn flex-1 text-sm py-2 px-3 rounded-lg text-gray-400 hover:text-white transition"
      onclick="loadDiscover('similar', this)">Similar</button>
    <button class="tab-btn flex-1 text-sm py-2 px-3 rounded-lg text-gray-400 hover:text-white transition"
      onclick="loadDiscover('top', this)">Top by Year</button>
  </div>

  <!-- Genre pills (populated dynamically after content loads) -->
  <div id="genre-pills-row" style="display:none" class="flex items-center gap-2 mb-4 flex-wrap">
    <span class="text-xs text-gray-500 shrink-0">Genre:</span>
    <div id="genre-pills" class="flex flex-wrap gap-2"></div>
    <button onclick="clearDiscoverGenres()" class="text-xs text-gray-600 hover:text-gray-400 transition ml-1">Clear</button>
  </div>

  <!-- Content -->
  <div id="discover-content"
    hx-get="/discover/trending"
    hx-trigger="load"
    hx-swap="innerHTML">
    <div class="text-center py-16 text-gray-500 text-sm">Loading...</div>
  </div>

  <!-- Trailer modal -->
  <div id="trailer-modal" style="display:none"
    class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4"
    onclick="if(event.target===this) closeTrailerModal()">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-2xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
        <span class="text-sm font-medium text-gray-300">Trailer</span>
        <button onclick="closeTrailerModal()" class="text-gray-500 hover:text-white text-2xl leading-none">×</button>
      </div>
      <div id="trailer-frame"></div>
    </div>
  </div>

  <!-- Description modal -->
  <div id="discover-modal"
    style="display:none"
    class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4"
    onclick="if(event.target===this) closeDiscoverModal()">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md overflow-hidden">
      <div class="flex items-start gap-3 p-4 pb-3">
        <img id="modal-poster" src="" alt="" class="w-16 h-24 object-cover rounded-lg flex-shrink-0" />
        <div class="flex-1 min-w-0">
          <h3 id="modal-name" class="text-white font-semibold leading-tight pr-2"></h3>
          <div class="flex items-center gap-3 mt-1.5 flex-wrap">
            <span id="modal-year" class="text-gray-500 text-sm"></span>
            <a id="modal-rating" href="" target="_blank" rel="noopener"
              class="text-yellow-400 text-sm hover:text-yellow-300 transition"></a>
            <button id="modal-trailer-btn"
              hx-target="#trailer-frame" hx-swap="innerHTML"
              class="text-xs text-gray-400 hover:text-white border border-gray-700 hover:border-gray-500 px-2.5 py-1 rounded-lg transition">▶ Trailer</button>
          </div>
        </div>
        <button onclick="closeDiscoverModal()"
          class="text-gray-500 hover:text-white text-2xl leading-none flex-shrink-0 -mt-0.5">×</button>
      </div>
      <p id="modal-overview" class="text-gray-400 text-sm px-4 pb-5 leading-relaxed"></p>
    </div>
  </div>

  <script>
    var discoverType = 'tv';
    var discoverCategory = 'trending';
    var selectedDiscoverGenres = new Set();

    // TMDB genre ID → name maps for client-side filtering
    var TV_GENRE_MAP = {
      10759:'Action & Adventure', 16:'Animation', 35:'Comedy', 80:'Crime',
      99:'Documentary', 18:'Drama', 10751:'Family', 10762:'Kids', 9648:'Mystery',
      10763:'News', 10764:'Reality', 10765:'Sci-Fi & Fantasy', 10766:'Soap',
      10767:'Talk', 10768:'War & Politics', 37:'Western'
    };
    var MOVIE_GENRE_MAP = {
      28:'Action', 12:'Adventure', 16:'Animation', 35:'Comedy', 80:'Crime',
      99:'Documentary', 18:'Drama', 10751:'Family', 14:'Fantasy', 36:'History',
      27:'Horror', 10402:'Music', 9648:'Mystery', 10749:'Romance',
      878:'Science Fiction', 53:'Thriller', 10752:'War', 37:'Western'
    };

    function setDiscoverType(type) {
      discoverType = type;
      var active = 'text-sm px-4 py-1.5 rounded-full bg-blue-600 text-white font-medium transition';
      var inactive = 'text-sm px-4 py-1.5 rounded-full bg-gray-800 text-gray-400 hover:text-white transition';
      document.getElementById('type-btn-tv').className = type === 'tv' ? active : inactive;
      document.getElementById('type-btn-movies').className = type === 'movies' ? active : inactive;
      selectedDiscoverGenres.clear();
      loadContent();
    }

    function loadDiscover(category, btn) {
      discoverCategory = category;
      document.querySelectorAll('.tab-btn').forEach(function(b) {
        b.classList.remove('bg-gray-800', 'text-white', 'font-medium');
        b.classList.add('text-gray-400');
      });
      if (btn) {
        btn.classList.remove('text-gray-400');
        btn.classList.add('bg-gray-800', 'text-white', 'font-medium');
      }
      selectedDiscoverGenres.clear();
      loadContent();
    }

    function loadContent() {
      var url = discoverType === 'tv'
        ? '/discover/' + discoverCategory
        : '/discover/movies/' + discoverCategory;
      htmx.ajax('GET', url, {target: '#discover-content', swap: 'innerHTML'});
      closeDiscoverModal();
    }

    function buildGenrePills() {
      var genreMap = discoverType === 'tv' ? TV_GENRE_MAP : MOVIE_GENRE_MAP;
      var allGenreIds = new Set();
      document.querySelectorAll('[data-genre-ids]').forEach(function(el) {
        try {
          JSON.parse(el.dataset.genreIds || '[]').forEach(function(id) { allGenreIds.add(id); });
        } catch(e) {}
      });

      var pills = document.getElementById('genre-pills');
      pills.innerHTML = '';

      var genres = Array.from(allGenreIds)
        .map(function(id) { return { id: id, name: genreMap[id] }; })
        .filter(function(g) { return g.name; })
        .sort(function(a, b) { return a.name.localeCompare(b.name); });

      if (genres.length === 0) {
        document.getElementById('genre-pills-row').style.display = 'none';
        return;
      }

      genres.forEach(function(genre) {
        var btn = document.createElement('button');
        btn.textContent = genre.name;
        btn.dataset.genreId = genre.id;
        btn.className = 'genre-pill text-xs px-3 py-1 rounded-full bg-gray-800 text-gray-400 hover:text-white transition';
        btn.onclick = function() { toggleDiscoverGenre(btn, genre.id); };
        pills.appendChild(btn);
      });

      document.getElementById('genre-pills-row').style.display = 'flex';
    }

    function toggleDiscoverGenre(btn, genreId) {
      if (selectedDiscoverGenres.has(genreId)) {
        selectedDiscoverGenres.delete(genreId);
        btn.className = 'genre-pill text-xs px-3 py-1 rounded-full bg-gray-800 text-gray-400 hover:text-white transition';
      } else {
        selectedDiscoverGenres.add(genreId);
        btn.className = 'genre-pill text-xs px-3 py-1 rounded-full bg-blue-600 text-white transition';
      }
      filterDiscoverCards();
    }

    function clearDiscoverGenres() {
      selectedDiscoverGenres.clear();
      document.querySelectorAll('#genre-pills .genre-pill').forEach(function(btn) {
        btn.className = 'genre-pill text-xs px-3 py-1 rounded-full bg-gray-800 text-gray-400 hover:text-white transition';
      });
      filterDiscoverCards();
    }

    function filterDiscoverCards() {
      var selected = Array.from(selectedDiscoverGenres);
      document.querySelectorAll('.discover-card-wrapper').forEach(function(wrapper) {
        var el = wrapper.querySelector('[data-genre-ids]');
        if (!el) { wrapper.style.display = ''; return; }
        if (selected.length === 0) { wrapper.style.display = ''; return; }
        try {
          var ids = JSON.parse(el.dataset.genreIds || '[]');
          wrapper.style.display = selected.some(function(id) { return ids.includes(id); }) ? '' : 'none';
        } catch(e) { wrapper.style.display = ''; }
      });
    }

    function openDiscoverModal(el) {
      document.getElementById('modal-name').textContent = el.dataset.name;
      document.getElementById('modal-overview').textContent = el.dataset.overview || 'No description available.';
      document.getElementById('modal-year').textContent = el.dataset.year;

      var poster = document.getElementById('modal-poster');
      poster.src = el.dataset.poster || '';
      poster.style.display = el.dataset.poster ? '' : 'none';

      var rating = document.getElementById('modal-rating');
      var mediaPath = (el.dataset.mediaType === 'movie') ? 'movie' : 'tv';
      if (el.dataset.rating) {
        rating.textContent = '★ ' + el.dataset.rating + ' on TMDB';
        rating.href = 'https://www.themoviedb.org/' + mediaPath + '/' + el.dataset.tmdbId;
      } else {
        rating.textContent = '';
      }

      var trailerBtn = document.getElementById('modal-trailer-btn');
      trailerBtn.setAttribute('hx-get', '/trailer/' + mediaPath + '/' + el.dataset.tmdbId);
      htmx.process(trailerBtn);

      document.getElementById('discover-modal').style.display = 'flex';
    }

    function closeDiscoverModal() {
      document.getElementById('discover-modal').style.display = 'none';
    }

    function closeTrailerModal() {
      document.getElementById('trailer-modal').style.display = 'none';
      document.getElementById('trailer-frame').innerHTML = '';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { closeTrailerModal(); closeDiscoverModal(); }
    });

    document.body.addEventListener('htmx:afterSwap', function(e) {
      if (e.detail.target && e.detail.target.id === 'trailer-frame') {
        document.getElementById('trailer-modal').style.display = 'flex';
      }
      if (e.detail.target && e.detail.target.id === 'discover-content') {
        buildGenrePills();
      }
    });
  </script>

</body>
</html>
