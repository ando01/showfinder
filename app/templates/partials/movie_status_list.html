{% for movie in movies %}
  {% include "partials/movie_card.html" %}
{% else %}
  {% if status == 'want_to_watch' %}
    <div class="text-center py-10 text-gray-500">
      <p class="text-base mb-1">Your movie list is empty.</p>
      <p class="text-sm">Search for a movie above or <a href="/discover" class="text-purple-400 hover:underline">browse Discover</a>.</p>
    </div>
  {% else %}
    <div class="text-center py-10 text-gray-500">
      <p class="text-base">No watched movies yet.</p>
    </div>
  {% endif %}
{% endfor %}
