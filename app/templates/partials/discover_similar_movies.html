{% if sections %}
  <div class="space-y-8">
    {% for movie_title, shows in sections %}
      <div>
        <h3 class="text-sm font-medium text-gray-400 mb-3">
          Because you want to watch <span class="text-white">{{ movie_title }}</span>
        </h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
          {% for show in shows[:8] %}
            {% include "partials/discover_card.html" %}
          {% endfor %}
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-center py-16">
    <p class="text-gray-500 text-sm">No recommendations yet.</p>
    <p class="text-gray-600 text-xs mt-1">Add some movies to your list to get started.</p>
  </div>
{% endif %}
