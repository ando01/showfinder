<div class="flex items-center gap-3 mb-5">
  <label class="text-sm text-gray-400">Year</label>
  <select
    name="year"
    hx-get="/discover/top"
    hx-target="#discover-content"
    hx-swap="innerHTML"
    hx-include="this"
    class="bg-gray-800 border border-gray-700 text-sm text-white rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
  >
    {% for y in years %}
      <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
    {% endfor %}
  </select>
</div>
{% if shows %}
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
    {% for show in shows %}
      {% include "partials/discover_card.html" %}
    {% endfor %}
  </div>
{% else %}
  <p class="text-gray-500 text-sm text-center py-16">No shows found for {{ selected_year }}.</p>
{% endif %}
